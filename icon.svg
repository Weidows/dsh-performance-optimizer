<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Performance Optimizer">
  <defs>
    <linearGradient id="po-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="12" fill="url(#po-grad)"/>
  <!-- horizontal bars reminiscent of a monitoring dashboard -->
  <rect x="14" y="34" width="8" height="16" rx="2" fill="#ffffff" opacity="0.95"/>
  <rect x="26" y="24" width="8" height="26" rx="2" fill="#ffffff" opacity="0.95"/>
  <rect x="38" y="18" width="8" height="32" rx="2" fill="#ffffff" opacity="0.95"/>
  <rect x="14" y="14" width="32" height="2" rx="1" fill="#ffffff" opacity="0.6"/>
</svg>
